name: CI PLOTIART

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      publish:
        description: Preparar el artefacto para GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Revisar y compilar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint -- --deny-warnings

      - name: Compilar proyecto
        run: npm run build

      - name: Guardar sitio compilado
        if: inputs.publish == true
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist